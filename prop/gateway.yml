spring:
  cloud:
    gateway:
      default-filters:
        - TokenRelay=
      routes:
        - id: license
          uri: lb://license
          predicates:
            - Path=/license/**
        - id: company
          uri: lb://company
          predicates:
            - Path=/company/**
  reactor:
    context-propagation: auto

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8073/realms/msa-realm

logging:
  level:
    root: info
    org.springframework.security: debug
    org.springframework.cloud.gateway: debug
    reactor.netty: debug
    org.springframework.cloud.loadbalancer: debug
    com.netflix.discovery: debug

management:
  endpoint:
    gateway:
      enabled: true